name: Nightly catalogue audit

# Audits every collection and scope of the DaFab catalogue through the public API with the
# shared read profile, then publishes the static site. No secret is used anywhere in this
# workflow: no database, no storage credentials, no tokens beyond the job's own GITHUB_TOKEN.

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      inventory:
        description: "Attached files and replica states: rotating share plus changed and sampled items, or every item"
        type: choice
        options: [rotate, all]
        default: rotate
      verify:
        description: "Download and checksum: changed and sampled items, every item, or nothing"
        type: choice
        options: [changed, all, none]
        default: changed
      sample:
        description: "Random items added to inventory and verification per unit"
        type: string
        default: "20"
  push:
    branches: [main]
    paths:
      - src/dafab_audit/nightly.py
      - site/**
      - pyproject.toml
      - .github/workflows/nightly.yml

permissions:
  contents: read

concurrency:
  group: nightly-audit
  cancel-in-progress: false

env:
  AUDIT_SITE_URL: https://dafab-ai-eu.github.io/dafab-audit
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  collect:
    name: audit ${{ matrix.unit }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        unit: [sentinel_2_l2a, water_analysis, smart_agriculture, hand, worldcover, gfm]
    steps:
      - name: Check out the audit tool
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install the audit tool
        run: python -m pip install --quiet .

      - name: Audit the unit
        run: |
          dafab-audit-nightly collect \
            --unit "${{ matrix.unit }}" \
            --output units \
            --threads 4 \
            --inventory "${{ github.event.inputs.inventory || 'rotate' }}" \
            --verify "${{ github.event.inputs.verify || 'changed' }}" \
            --sample "${{ github.event.inputs.sample || '20' }}"

      - name: Keep the unit state for the publisher
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: unit-${{ matrix.unit }}
          path: units/${{ matrix.unit }}.json
          retention-days: 3
          if-no-files-found: error

  publish:
    name: publish the site
    needs: collect
    if: ${{ always() && needs.collect.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the site template
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install the audit tool
        run: python -m pip install --quiet .

      - name: Collect the unit states
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: unit-*
          path: units
          merge-multiple: true

      - name: Build the site
        env:
          AUDIT_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          AUDIT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: dafab-audit-nightly publish --units units --template site --output _site

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
