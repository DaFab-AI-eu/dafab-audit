[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dafab-audit"
version = "0.1.0"
description = "Audit and report tooling for DaFab generated products."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "DaFab" }
]
dependencies = [
  "dafab-client>=3.1.0,<4",
  "numpy>=2.2.6,<3",
  "Pillow>=12.2.0,<13",
  "psycopg[binary]>=3.3.4,<4",
  "rasterio>=1.4.4,<1.5",
  "requests>=2.33.1,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=9.0.3,<10",
]

[project.scripts]
dafab-audit-report = "dafab_audit.report:main"
dafab-audit-compare = "dafab_audit.compare:main"

[project.urls]
Repository = "https://github.com/DaFab-AI-eu/dafab-audit"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
